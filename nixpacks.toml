# Nixpacks Configuration for Railway Deployment
# This explicitly defines the build process to prevent auto-detection conflicts

# Explicitly use Python provider
providers = ["python"]

# Setup phase: Install system packages
[phases.setup]
nixPkgs = ["python311", "gcc", "postgresql"]

# Skip install phase entirely (no auto-detection, no pip install .)
# This prevents Nixpacks from trying to install the project as a package

# Build phase: Install production dependencies only
[phases.build]
cmds = ["pip install --no-cache-dir -r requirements-prod.txt"]

# Start command: Run FastAPI with uvicorn
[start]
cmd = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
